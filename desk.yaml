desk:
  name: "Gold and Crypto AI Intraday Trading Desk"
  mode: paper
  paper_venue: paper-sim-v1
  risk_profile_version: paper-v1
  setup_version: sweep-reclaim-v1
  symbols:
    - XAU/USD
    - BTC/USDT
    - ETH/USDT
  timeframes:
    regime: 1h
    structure: 15m
    execution: 5m

account:
  equity: 100000.0
  currency: USD

risk:
  risk_per_trade_pct: 0.0025
  max_daily_loss_pct: 0.01
  max_open_risk_pct: 0.0075
  max_concurrent_positions: 1
  max_positions_per_symbol: 1
  max_loss_streak: 3
  min_planned_rr: 1.5
  max_stop_atr_multiple: 2.0
  max_spread_vs_median: 2.0
  data_freshness:
    max_bar_intervals_late: 2
    quote_max_age_seconds:
      crypto: 5
      gold: 10

paper:
  fee_bps: 2.0
  slippage_bps: 1.5
  contract_value:
    "XAU/USD": 1.0
    "BTC/USDT": 1.0
    "ETH/USDT": 1.0
  lot_increment:
    "XAU/USD": 0.01
    "BTC/USDT": 0.0001
    "ETH/USDT": 0.001

live:
  enabled: false
  require_owner_ack_file: true
  owner_ack_path: artifacts/LIVE_OWNER_ACK

kill_switch:
  path: artifacts/kill_switch.json
  default_level: CLEAR

paths:
  journal_dir: artifacts/journal
  signal_dir: artifacts/signals
  replay_dir: artifacts/replay
